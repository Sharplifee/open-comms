name: OpenComms
options:
  bundleIdPrefix: com.connor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.0.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.36.0

targets:
  OpenComms:
    type: application
    platform: iOS
    sources:
      - path: Sources/OpenComms
    dependencies:
      - package: LiveKit
      - package: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.opencomms
        DEVELOPMENT_TEAM: XF783932R2
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sources/OpenComms/Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: open comms App Store
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Sources/OpenComms/Support/Info.plist
      properties:
        CFBundleDisplayName: open comms
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Required whenever the icon comes from an asset catalog, which it
        # does. Its absence does not fail the build or the upload - altool
        # reports UPLOAD SUCCEEDED - and then Apple discards the binary
        # during processing and emails ITMS-90713. That is exactly what
        # happened to every open comms delivery so far: no build ever
        # appeared in App Store Connect.
        CFBundleIconName: AppIcon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        # Export compliance answered here so no human has to tick a box in
        # App Store Connect before every single build can reach a tester.
        ITSAppUsesNonExemptEncryption: false
        # Six strings, and not one more. App Review rejects permissions the
        # app does not actually exercise, so this list is a ceiling.
        NSMicrophoneUsageDescription: >-
          open comms is a voice line. The microphone is how your squad hears you.
        NSLocationWhenInUseUsageDescription: >-
          Shows who is nearby so you can open a line with one tap. Only while
          you have the app open, and you can hide any time.
        NSBluetoothAlwaysUsageDescription: >-
          Connects your AirPods or other Bluetooth headphones to the line.
        NSAppleMusicUsageDescription: >-
          Turns your music down while somebody is talking and puts it back
          where it was afterwards.
        NSLocalNetworkUsageDescription: >-
          Connects voice directly between phones on the same network, which
          keeps the line quick.
        # This app never opens a camera, but LiveKit links Apple's camera
        # capture APIs and Apple scans the binary rather than the code path.
        # Without the string the upload is rejected ITMS-90683. Learned the
        # hard way on squad comms.
        NSCameraUsageDescription: >-
          open comms does not use the camera. Its audio library links Apple's
          camera APIs, so this permission is never requested.
